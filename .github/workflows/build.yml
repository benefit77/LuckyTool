name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 项目根 build.gradle.kts 强制读取 keystore/keystore.properties，
      # 这里根据 GitHub Secrets 生成签名配置；没有密钥时生成临时调试密钥。
      - name: 准备签名配置
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > keystore/luckytool.jks
          else
            keytool -genkeypair -v \
              -keystore keystore/luckytool.jks \
              -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          printf 'storeFile=%s\n' "${GITHUB_WORKSPACE}/keystore/luckytool.jks" > keystore/keystore.properties
          printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD:-android}" >> keystore/keystore.properties
          printf 'keyAlias=%s\n' "${KEYSTORE_ALIAS:-android}" >> keystore/keystore.properties
          printf 'keyPassword=%s\n' "${KEYSTORE_KEY_PASSWORD:-android}" >> keystore/keystore.properties

      - name: 编译 release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTool-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
