name: Build APK

on:
  push:
    # libxposed 分支暂不自动构建：上游依赖
    # com.highcapable.yukihookapi:yukihook-{bom,core,compiler,runtime-libxposed}:1.5.0-beta.4
    # 尚未发布到公开仓库（上游靠 mavenLocal 构建），依赖解析必然失败。
    # 需要验证时用 workflow_dispatch 手动触发，或等上游发布后把 libxposed 加回来。
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 编译 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          # SDK 仓库里没有 platforms;android-37（API 37 的包名是 android-37.0），
          # 平台由 AGP 在构建时按需自动安装
          packages: "platform-tools build-tools;36.0.0"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 项目根 build.gradle.kts 强制读取 keystore/keystore.properties，
      # 这里根据 GitHub Secrets 生成签名配置；没有密钥时生成临时调试密钥。
      - name: 准备签名配置
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore

          # app/proguard-rules.pro 引用了 keystore/proguard-custom.txt 作为混淆字典，
          # 该文件在 .gitignore 中，CI 上生成一份默认词表
          cat > keystore/proguard-custom.txt <<'EOF'
          android
          system
          framework
          service
          manager
          module
          config
          control
          center
          status
          quick
          panel
          volume
          brightness
          notification
          settings
          screen
          display
          battery
          power
          storage
          network
          wifi
          bluetooth
          signal
          media
          audio
          sound
          vibrate
          gesture
          navigation
          launcher
          package
          activity
          fragment
          dialog
          window
          theme
          color
          light
          dark
          night
          update
          backup
          restore
          clear
          cache
          memory
          process
          thread
          handler
          binder
          proxy
          wrapper
          helper
          util
          core
          base
          root
          tool
          task
          work
          EOF

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > keystore/luckytool.jks
          else
            keytool -genkeypair -v \
              -keystore keystore/luckytool.jks \
              -alias android -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          printf 'storeFile=%s\n' "${GITHUB_WORKSPACE}/keystore/luckytool.jks" > keystore/keystore.properties
          printf 'storePassword=%s\n' "${KEYSTORE_PASSWORD:-android}" >> keystore/keystore.properties
          printf 'keyAlias=%s\n' "${KEYSTORE_ALIAS:-android}" >> keystore/keystore.properties
          printf 'keyPassword=%s\n' "${KEYSTORE_KEY_PASSWORD:-android}" >> keystore/keystore.properties

      - name: 编译 release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTool-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
